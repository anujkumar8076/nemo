version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /apps/worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
